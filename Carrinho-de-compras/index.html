<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- Nav-->
      <div class="nav container">
        <a href="#" class="logo">Ecommerce</a>
        <!-- Cart Icon -->
        <ion-icon name="bag-outline" id="cart-icon"></ion-icon>
        <div class="cart">
          <div class="cart-title">Your Cart</div>
          <!-- Content -->
          <div class="cart-content"></div>
          <!-- Total -->
          <div class="total">
            <div class="total-title">Total</div>
            <div class="total-price">R$0,00</div>
          </div>
          <!-- Buy button -->
          <button type="" class="btn-buy">Comprar Agora</button>
          <!-- Cart Close -->
          <ion-icon name="close" id="close-cart"></ion-icon>
        </div>
      </div>
    </header>
    <!-- SHOP -->
    <section class="shop container">
      <h2 class="section-title">Shop Products</h2>
      <!-- Content -->
      <div class="shop-content">
        <!-- Box 1 -->
        <div class="product-box">
          <img src="img/product1.jpg" alt="" class="product-img" />
          <h2 class="product-title">AEROREADY SHIRT</h2>
          <span class="price">R$75,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 2 -->
        <div class="product-box">
          <img src="img/product2.jpg" alt="" class="product-img" />
          <h2 class="product-title">Earbuds</h2>
          <span class="price">R$255,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 3 -->
        <div class="product-box">
          <img src="img/product3.jpg" alt="" class="product-img" />
          <h2 class="product-title">Oversized</h2>
          <span class="price">R$75,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 4 -->
        <div class="product-box">
          <img src="img/product4.jpg" alt="" class="product-img" />
          <h2 class="product-title">Straw metal bottle</h2>
          <span class="price">R$95,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 5 -->
        <div class="product-box">
          <img src="img/product5.jpg" alt="" class="product-img" />
          <h2 class="product-title">Metal Glasses</h2>
          <span class="price">R$125,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 6 -->
        <div class="product-box">
          <img src="img/product6.jpg" alt="" class="product-img" />
          <h2 class="product-title">Cap 2135</h2>
          <span class="price">R$75,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 7 -->
        <div class="product-box">
          <img src="img/product7.jpg" alt="" class="product-img" />
          <h2 class="product-title">Backpack</h2>
          <span class="price">R$170,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
        <!-- Box 8 -->
        <div class="product-box">
          <img src="img/product8.jpg" alt="" class="product-img" />
          <h2 class="product-title">Ultraboost 22</h2>
          <span class="price">R$325,00</span>
          <ion-icon name="bag-add-outline" class="add-cart"></ion-icon>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
