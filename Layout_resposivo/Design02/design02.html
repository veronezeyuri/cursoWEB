<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="design02.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Sharp"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"
      integrity="sha512-aVKKRRi/Q/YV+4mjoKBsE4x3H+BkegoM/em46NNlCqNTmUYADjBbeNefNxYV7giUp0VxICtqdrbqU7iVaeZNXA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.2/js/bootstrap.min.js"
      integrity="sha512-5BqtYqlWfJemW5+v+TZUs22uigI8tXeVah5S/1Z6qBLVO7gakAOtkOzUtgq6dsIo5c0NJdmGPs0H9I+2OHUHVQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <header class="menu-principal">
      <div class="header-1">
        <div class="logo">
          <a href="#"><img src="" alt="" /></a>
        </div>
        <ul class="redes-sociais">
          <li>
            <a href="#"
              ><img class="social-logo" src="images/icons8-twitter.svg" alt=""
            /></a>
          </li>
          <li>
            <a href="#"
              ><img
                class="social-logo"
                src="images/icons8-linkedin-circundado.svg"
                alt=""
            /></a>
          </li>
          <li>
            <a href="https://www.instagram.com/veronezeyuri"
              ><img
                class="social-logo"
                src="images/icons8-instagram.svg"
                alt=""
            /></a>
          </li>
          <li>
            <a href="#"
              ><img
                class="social-logo"
                src="images/icons8-facebook-novo.svg"
                alt=""
            /></a>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <div class="header-2">
        <ul class="menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Serviços</a></li>
          <li><a href="#">Páginas</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
        <div class="search-box">
          <input type="text" placeholder="Procure por algo" />
          <a href="#" class="btn">
            <span class="material-icons-sharp"> search</span>
          </a>
        </div>
      </div>
    </main>
    <div class="slide-principal">
      <div class="slides">
        <div id="voltar" class="btn">
          <span class="material-icons-sharp"> chevron_left</span>
        </div>
        <div id="proximo" class="btn">
          <span class="material-icons-sharp"> chevron_right</span>
        </div>
        <div id="atual" class="images">
          <img
            src="images/michelangelo-amoruso-manzari-TrFWg-I7HB4-unsplash.jpg"
            alt=""
          />
        </div>
        <div class="images">
          <img src="images/peter-herrmann-TBnzGrBXhiQ-unsplash.jpg" alt="" />
        </div>
        <div class="images">
          <img src="images/ramiro-pianarosa-58D_0KgqNlc-unsplash.jpg" alt="" />
        </div>
        <div class="dots">
          <div class="active" id="0"></div>
          <div id="1"></div>
          <div id="2"></div>
        </div>
      </div>
    </div>

    <script>
      var dots = document.querySelector(".dots");
      var quantidade = document.querySelectorAll(".slides .images");
      var slideIndex = 1;
      var proximo = document.getElementById("proximo");
      var voltar = document.getElementById("voltar");

      for (let i = 0; i < quantidade.length; i++) {
        var div = document.createElement("div");
        div.id = i;
        dots.appendChild(div);
      }
      document.getElementById("0").classList.add("imgAtual");
      var pos = document.querySelectorAll(".dots div");
      for (let i = 0; i < pos.length; i++) {
        pos[i].addEventListener("click", function () {
          slide(pos[i]);
        });
      }
      voltar.addEventListener("click", () => {
        slideIndex--;
        slide(slideIndex);
      });
      proximo.addEventListener("click", () => {
        slideIndex++;
        slide(slideIndex);
      });

      slide(slideIndex);
      function slide(n) {
        var i;
        if (n > quantidade.length) {
          slideIndex = 1;
        }
        if (n < 1) {
          slideIndex = quantidade.length;
        }
        for (i = 0; i < quantidade.length; i++) {
          quantidade[i].style.display = "none";
        }
        quantidade[slideIndex - 1].style.display = "block";
      }
    </script>
  </body>
</html>
